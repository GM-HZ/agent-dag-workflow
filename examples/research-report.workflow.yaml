apiVersion: workflow.gm-hz.dev/v1
kind: WorkflowTemplate
metadata:
  id: research-report
  name: Research report
  description: Collect independent research and synthesize a structured report.
spec:
  requires:
    - { kind: capability, uses: gateway.agent.execute }
  inputSchema:
    type: object
    additionalProperties: false
    required: [topic]
    properties:
      topic:
        type: string
        minLength: 1
  outputSchema:
    type: object
    additionalProperties: false
    required: [report]
    properties:
      report:
        type: string
  nodes:
    - id: start
      uses: core.start@1
      title: Input
      with: {}
      inputs: {}

    - id: collect
      uses: agent.run@1
      title: Collect evidence
      with:
        prompt: Research the topic from multiple independent sources. Return concise evidence and source locations.
        outputSchema:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [claim, source]
                properties:
                  claim: { type: string }
                  source: { type: string }
      expects:
        maxBytes: 262144
        schema:
          type: object
          additionalProperties: false
          required: [runId, content, structured]
          properties:
            runId: { type: string }
            content: { type: array }
            structured:
              type: object
              required: [items]
              properties:
                items: { type: array }
      inputs:
        topic:
          input: { path: [topic] }

    - id: summarize
      uses: agent.run@1
      title: Synthesize report
      with:
        prompt: Synthesize the evidence into a clear report. Preserve uncertainty and source attribution.
        outputSchema:
          type: object
          additionalProperties: false
          required: [report]
          properties:
            report: { type: string }
      expects:
        maxBytes: 524288
        schema:
          type: object
          additionalProperties: false
          required: [runId, content, structured]
          properties:
            runId: { type: string }
            content: { type: array }
            structured:
              type: object
              required: [report]
              properties:
                report: { type: string }
      inputs:
        topic:
          input: { path: [topic] }
        evidence:
          output:
            nodeId: collect
            path: [structured, items]

    - id: end
      uses: core.end@1
      title: Output
      with: {}
      inputs:
        report:
          output:
            nodeId: summarize
            path: [structured, report]

  edges:
    - id: start-to-collect
      source: start
      target: collect
    - id: collect-to-summarize
      source: collect
      target: summarize
    - id: summarize-to-end
      source: summarize
      target: end

  outputs:
    report:
      output:
        nodeId: end
        path: [report]

  policies:
    maxConcurrentNodes: 2
    maxNodeRuns: 8
    maxDurationMs: 600000
    maxOutputBytes: 1048576
    subworkflowMaxDepth: 4

layout:
  engine: xyflow
  viewport: { x: 40, y: 80, zoom: 0.9 }
  nodes:
    start: { x: 0, y: 120 }
    collect: { x: 320, y: 120 }
    summarize: { x: 640, y: 120 }
    end: { x: 960, y: 120 }
