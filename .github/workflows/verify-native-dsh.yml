name: Verify native DSH

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dsh-version: [0.2.0-rc.2, 0.2.2-rc.5]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright-cli install-browser --with-deps chromium
      - run: pnpm verify:dsh-native
        env:
          AGENT_DAG_DSH_VERSION: ${{ matrix.dsh-version }}
